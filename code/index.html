<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokèsnap - Pokémon History Database</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🔴 Pokèsnap 🔵</h1>
            <p class="tagline">Complete History of Every Pokémon Event, Card & More</p>
        </div>
        <nav>
            <ul>
                <li><a href="#events">Events</a></li>
                <li><a href="#cards">Trading Cards</a></li>
                <li><a href="#games">Games</a></li>
                <li><a href="#search">Search</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="search" class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search Pokémon, events, cards..." class="search-box">
                <button onclick="searchPokemon()">Search</button>
            </div>
            <div id="searchResults" class="results-container"></div>
        </section>

        <section id="events" class="section">
            <h2>🏯 Pokémon Events</h2>
            <div class="events-grid" id="eventsGrid"></div>
        </section>

        <section id="cards" class="section">
            <h2>🃏 Trading Cards History</h2>
            <div class="cards-grid" id="cardsGrid"></div>
        </section>

        <section id="games" class="section">
            <h2>🎮 Games & Releases</h2>
            <div class="games-grid" id="gamesGrid"></div>
        </section>

        <section id="stats" class="section">
            <h2>📊 Statistics</h2>
            <div class="stats-container" id="statsContainer"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Pokèsnap - A Complete Pokémon History Archive | Pokémon is a trademark of The Pokémon Company</p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
